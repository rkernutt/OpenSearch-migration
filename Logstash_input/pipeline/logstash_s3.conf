# Read NDJSON parts from S3 and write them to Elastic Cloud (Hosted or Serverless).
#
# Pairs with the Python S3 staging path:
#   1. python -m s3_migration.s3_extract  --s3-uri s3://bucket/job/ ...
#   2. (this pipeline)                    reads s3://bucket/job/data/.../*.ndjson(.gz)
#                                         and writes to ${LOGSTASH_DEST_INDEX}
#   3. python validate_migration.py       reconciles counts on the destination
#
# It also works for any S3 prefix containing NDJSON or NDJSON.gz (partner drops,
# elasticdump exports, etc.).
#
# IMPORTANT: when the input is bulk-format NDJSON (alternating action/source
# lines) produced by `s3_extract.py`, prefer `s3_bulk_load.py` over Logstash —
# the Python loader preserves `_id` and the document/action mapping exactly.
# This pipeline is best for source-only NDJSON (one source document per line)
# where you want Logstash's filter ecosystem (mutate, grok, translate, ...).
#
# Required .env (see ../examples/env/logstash-s3.env.example):
#   AWS_REGION, S3_BUCKET, S3_PREFIX, LOGSTASH_DEST_INDEX
#   ELASTIC_CLOUD_ID, ELASTIC_CLOUD_AUTH   (or DEST_ELASTIC_HOST + DEST_ELASTIC_API_KEY)
#
# Run from this directory:
#   docker compose --profile s3 up --build
#
# AWS credentials: leave AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY unset to use
# the container task role / EC2 instance role / shared credentials file. Set
# them only for local development.

input {
  s3 {
    bucket             => "${S3_BUCKET}"
    prefix             => "${S3_PREFIX}"
    region             => "${AWS_REGION:us-east-1}"
    codec              => "json_lines"
    sincedb_path       => "/usr/share/logstash/data/.s3_sincedb"
    interval           => 60
    backup_to_dir      => "${S3_BACKUP_DIR:}"
    delete             => false
  }
}

filter {
  # Drop Logstash bookkeeping fields. ``@timestamp`` removal is opt-in via env
  # so callers who care about ingest time can keep it.
  mutate {
    remove_field => [ "@version" ]
  }
  if "${LOGSTASH_REMOVE_TIMESTAMP:false}" == "true" {
    mutate { remove_field => [ "@timestamp" ] }
  }
}

output {
  elasticsearch {
    # Cloud ID / cloud_auth path (default).
    cloud_id              => "${ELASTIC_CLOUD_ID:}"
    cloud_auth            => "${ELASTIC_CLOUD_AUTH:}"
    # Hosted or Serverless via API key (uncomment in your override or use the
    # `apikey-s3` compose profile, which mounts a slightly different config).
    # hosts              => ["${DEST_ELASTIC_HOST}"]
    # api_key            => "${DEST_ELASTIC_API_KEY}"
    index                 => "${LOGSTASH_DEST_INDEX}"
    document_id           => "%{[@metadata][_id]}"   # populated only if upstream set it
    manage_template       => false
    ilm_enabled           => false
    ssl_verification_mode => full
  }
}
