# OpenSearch -> Elastic Cloud (API key flavour).
#
# Use this when your destination is configured with an API key instead
# of cloud_auth.
#
# Run: docker compose -f docker-compose.yml --profile apikey up --build
#
# Required .env: SOURCE_OPENSEARCH_*, LOGSTASH_SOURCE_INDEX,
#                DEST_ELASTIC_HOST, DEST_ELASTIC_API_KEY,
#                LOGSTASH_DEST_INDEX.
#
# The filter block is the hardened OpenSearch -> Elastic transform layer
# documented in ../README.md (section "Hardened transform filter").

input {
  opensearch {
    hosts => "${SOURCE_OPENSEARCH_HOST}"
    user => "${SOURCE_OPENSEARCH_USER}"
    password => "${SOURCE_OPENSEARCH_PASSWORD}"
    index => "${LOGSTASH_SOURCE_INDEX}"
    query => '{"query":{"match_all":{}}}'

    # Promote source _id / _index / _type into [@metadata][_*] so the
    # output preserves _id. See pipeline/logstash.conf for the rationale
    # behind not requesting _seq_no / _primary_term / _version / _score.
    docinfo => true
  }
}

filter {
  mutate {
    remove_field => [ "@version" ]
  }

  # Force destination type to "_doc" (ES 8+ rejects anything else).
  mutate {
    remove_field => [ "[@metadata][_type]" ]
    add_field    => { "[@metadata][_type]" => "_doc" }
  }

  # Optional drops for OpenSearch-specific document fields. See
  # pipeline/logstash.conf for the full commented example.
}

output {
  elasticsearch {
    hosts       => ["${DEST_ELASTIC_HOST}"]
    api_key     => "${DEST_ELASTIC_API_KEY}"
    index       => "${LOGSTASH_DEST_INDEX}"
    document_id => "%{[@metadata][_id]}"
    manage_template => false
    ilm_enabled     => false
    ssl_verification_mode => full
  }
}
