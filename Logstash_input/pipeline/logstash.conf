# OpenSearch -> Elastic Cloud (cloud_id / cloud_auth flavour).
#
# Environment variables are substituted at startup (see ../docker-compose.yml,
# repo-root .env).
#
# Required: SOURCE_OPENSEARCH_HOST, SOURCE_OPENSEARCH_USER,
#           SOURCE_OPENSEARCH_PASSWORD, LOGSTASH_SOURCE_INDEX,
#           LOGSTASH_DEST_INDEX, ELASTIC_CLOUD_ID, ELASTIC_CLOUD_AUTH.
#
# (API-key variant: pipeline/logstash_api_key.conf + compose profile apikey)
#
# The filter block is the hardened OpenSearch -> Elastic transform layer
# documented in ../README.md (section "Hardened transform filter") and
# ../../docs/KAFKA_MIGRATION.md (section "Document-level transform layer").

input {
  opensearch {
    hosts => "${SOURCE_OPENSEARCH_HOST}"
    user => "${SOURCE_OPENSEARCH_USER}"
    password => "${SOURCE_OPENSEARCH_PASSWORD}"
    index => "${LOGSTASH_SOURCE_INDEX}"
    # Override by mounting a custom pipeline file; keep JSON on one line.
    query => '{"query":{"match_all":{}}}'

    # Promote document metadata into [@metadata][_*] so the output can
    # preserve _id. Default docinfo_fields is [_index, _type, _id]; we do
    # NOT add _seq_no / _primary_term / _version / _score here because
    # they are either dangerous (cluster-internal checkpoints) or useless
    # (search-result-only) on the destination.
    docinfo => true
  }
}

filter {
  # 1. Logstash bookkeeping. @version is a Logstash pipeline marker
  # (1, 2, ...), NOT the Elasticsearch _version field. It must not land
  # in _source on the destination.
  mutate {
    remove_field => [ "@version" ]
  }

  # 2. Force destination type to "_doc". The OpenSearch input plugin
  # promotes the source _type to [@metadata][_type] (often "_doc"
  # already, sometimes a legacy ES 5/6 multi-type name). ES 8+ and
  # Elastic Cloud Serverless reject any non-"_doc" value, so set it
  # unconditionally.
  mutate {
    remove_field => [ "[@metadata][_type]" ]
    add_field    => { "[@metadata][_type]" => "_doc" }
  }

  # 3. Optional: drop OpenSearch-specific document fields that have no
  # valid destination mapping. Uncomment only when your source has them.
  #
  # mutate {
  #   remove_field => [
  #     "knn_vector",      # OS k-NN plugin field. Re-embed on the dest
  #                        # rather than carrying float arrays across
  #                        # incompatible vector formats.
  #     "[opensearch]",    # OS-specific telemetry sub-doc, when present.
  #     "[event][module]"  # ECS module name from OS Observability you
  #                        # do not want on the destination.
  #   ]
  # }
}

output {
  elasticsearch {
    cloud_id    => "${ELASTIC_CLOUD_ID}"
    cloud_auth  => "${ELASTIC_CLOUD_AUTH}"
    index       => "${LOGSTASH_DEST_INDEX}"
    document_id => "%{[@metadata][_id]}"
    manage_template => false
    ilm_enabled     => false

    # Do NOT set `version` / `version_type`. Default behaviour ignores
    # the source's _version, which is what we want.
  }
}
