input {
    opensearch {
        hosts => 'https://URL_Of_OpenSearch_Domain:443'
        user => 'username'
        password => 'password'
        index => 'source_index_name'
        query => '{ "query": {"match_all": {}} }'
        # Promote source _id / _index / _type into [@metadata][_*] so the
        # output preserves _id. See pipeline/logstash.conf for full
        # documentation of the hardened transform layer.
        docinfo => true
    }
}
filter {
    mutate {
        remove_field => [ "@version" ]
        remove_field => [ "@timestamp" ]
    }

    # Force destination type to "_doc" (ES 8+ rejects anything else).
    mutate {
        remove_field => [ "[@metadata][_type]" ]
        add_field    => { "[@metadata][_type]" => "_doc" }
    }
}
output {
    elasticsearch {
        cloud_id => 'elastic_cloud_id_from_deployment'
        cloud_auth => 'username:password'
        index => 'targetindexname'
        document_id => "%{[@metadata][_id]}"
    }
}
