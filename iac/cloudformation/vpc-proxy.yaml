AWSTemplateFormatVersion: '2010-09-09'
Description: >
  VPC Proxy for migrating from Amazon OpenSearch Service (private VPC, no internet egress)
  to Elastic Cloud. Deploys an nginx reverse proxy on EC2 inside the VPC that listens on
  port 9200 and forwards requests to an Elastic Cloud HTTPS endpoint via a NAT gateway.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy the proxy into.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >
      Private subnet for the proxy EC2 instance. The subnet must have outbound
      internet access via a NAT gateway so nginx can reach Elastic Cloud.

  ElasticCloudEndpoint:
    Type: String
    Description: >
      Full Elastic Cloud Elasticsearch URL including scheme and port.
      Example: https://my-deployment.es.us-east-1.aws.elastic-cloud.com:9243
    AllowedPattern: "^https://[a-zA-Z0-9._-]+(:[0-9]+)?$"
    ConstraintDescription: Must be an HTTPS URL, optionally with a port number.

  InstanceType:
    Type: String
    Default: t3.small
    Description: EC2 instance type for the proxy.
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t3.large
      - m5.large
      - m5.xlarge

  KeyPairName:
    Type: String
    Default: ''
    Description: >
      (Optional) EC2 Key Pair name for SSH access. Leave blank to rely solely
      on AWS Systems Manager Session Manager.

  AllowedCidr:
    Type: String
    Default: '10.0.0.0/8'
    Description: >
      CIDR range permitted to connect to the proxy on port 9200.
      Restrict this to your OpenSearch subnet CIDR for tighter security.
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    ConstraintDescription: Must be a valid CIDR block (e.g. 10.0.0.0/8).

# ---------------------------------------------------------------------------
# Conditions
# ---------------------------------------------------------------------------
Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, '']]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # -------------------------------------------------------------------------
  # Security Group
  # -------------------------------------------------------------------------
  ProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-proxy-sg'
      GroupDescription: >
        Allows inbound TCP 9200 from the specified CIDR and all outbound traffic
        so the proxy can reach Elastic Cloud via the NAT gateway.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 9200
          ToPort: 9200
          CidrIp: !Ref AllowedCidr
          Description: Proxy port from allowed CIDR
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: All outbound traffic (required for NAT gateway to Elastic Cloud)
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-proxy-sg'
        - Key: StackName
          Value: !Ref AWS::StackName

  # -------------------------------------------------------------------------
  # IAM Role & Instance Profile (SSM access)
  # -------------------------------------------------------------------------
  ProxyInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-proxy-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Tags:
        - Key: StackName
          Value: !Ref AWS::StackName

  ProxyInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${AWS::StackName}-proxy-profile'
      Roles:
        - !Ref ProxyInstanceRole

  # -------------------------------------------------------------------------
  # EC2 Launch Template
  # -------------------------------------------------------------------------
  ProxyLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${AWS::StackName}-proxy-lt'
      LaunchTemplateData:
        ImageId: !Sub >-
          {{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt ProxyInstanceProfile.Arn
        KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref AWS::NoValue]
        SecurityGroupIds:
          - !Ref ProxySecurityGroup
        MetadataOptions:
          HttpTokens: required          # IMDSv2 required for security
          HttpPutResponseHopLimit: 1
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            exec > >(tee /var/log/user-data.log | logger -t user-data) 2>&1

            echo "=== VPC Proxy bootstrap starting ==="

            # ----------------------------------------------------------------
            # 1. System update & nginx install
            # ----------------------------------------------------------------
            dnf update -y
            dnf install -y nginx

            # ----------------------------------------------------------------
            # 2. Derive upstream host and port from ElasticCloudEndpoint
            #    The parameter is expected to be: https://host:port
            # ----------------------------------------------------------------
            ELASTIC_ENDPOINT="${ElasticCloudEndpoint}"

            # Strip the trailing slash if present
            ELASTIC_ENDPOINT="${!ELASTIC_ENDPOINT%/}"

            # Extract host:port portion (strip https://)
            UPSTREAM="${!ELASTIC_ENDPOINT#https://}"

            # ----------------------------------------------------------------
            # 3. Write nginx configuration
            # ----------------------------------------------------------------
            cat > /etc/nginx/conf.d/elastic-proxy.conf <<'NGINXCONF'
            # Elastic Cloud reverse proxy
            # Managed by CloudFormation stack: ${AWS::StackName}

            upstream elastic_cloud {
                server UPSTREAM_PLACEHOLDER;
                keepalive 32;
            }

            server {
                listen 9200;
                server_name _;

                # Pass all client requests upstream to Elastic Cloud
                location / {
                    proxy_pass         https://elastic_cloud;
                    proxy_ssl_server_name on;
                    proxy_ssl_protocols TLSv1.2 TLSv1.3;

                    proxy_http_version 1.1;
                    proxy_set_header   Connection        "";
                    proxy_set_header   Host              $proxy_host;
                    proxy_set_header   X-Real-IP         $remote_addr;
                    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                    proxy_set_header   X-Forwarded-Proto $scheme;

                    # Generous timeouts for long-running migration bulk operations
                    proxy_connect_timeout 60s;
                    proxy_send_timeout    300s;
                    proxy_read_timeout    300s;

                    # Buffer settings suitable for bulk index payloads
                    proxy_buffering           off;
                    proxy_request_buffering   off;
                    client_max_body_size      256m;
                }
            }
            NGINXCONF

            # Substitute the real upstream value
            sed -i "s|UPSTREAM_PLACEHOLDER|${!UPSTREAM}|g" /etc/nginx/conf.d/elastic-proxy.conf

            # Remove the default server block to avoid port conflicts
            rm -f /etc/nginx/conf.d/default.conf

            # ----------------------------------------------------------------
            # 4. Validate nginx config and start service
            # ----------------------------------------------------------------
            nginx -t
            systemctl enable --now nginx
            echo "nginx started successfully"

            # ----------------------------------------------------------------
            # 5. Install and configure CloudWatch Agent
            # ----------------------------------------------------------------
            dnf install -y amazon-cloudwatch-agent

            cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<CWCONF
            {
              "agent": {
                "metrics_collection_interval": 60,
                "logfile": "/opt/aws/amazon-cloudwatch-agent/logs/amazon-cloudwatch-agent.log"
              },
              "metrics": {
                "namespace": "${AWS::StackName}/ProxyMetrics",
                "append_dimensions": {
                  "InstanceId": "\${aws:InstanceId}"
                },
                "metrics_collected": {
                  "cpu": {
                    "measurement": ["cpu_usage_idle", "cpu_usage_user", "cpu_usage_system"],
                    "metrics_collection_interval": 60
                  },
                  "mem": {
                    "measurement": ["mem_used_percent"],
                    "metrics_collection_interval": 60
                  },
                  "net": {
                    "measurement": ["bytes_sent", "bytes_recv"],
                    "metrics_collection_interval": 60
                  }
                }
              },
              "logs": {
                "logs_collected": {
                  "files": {
                    "collect_list": [
                      {
                        "file_path": "/var/log/nginx/access.log",
                        "log_group_name": "/aws/ec2/${AWS::StackName}/nginx-access",
                        "log_stream_name": "{instance_id}",
                        "timestamp_format": "%d/%b/%Y:%H:%M:%S %z"
                      },
                      {
                        "file_path": "/var/log/nginx/error.log",
                        "log_group_name": "/aws/ec2/${AWS::StackName}/nginx-error",
                        "log_stream_name": "{instance_id}",
                        "timestamp_format": "%Y/%m/%d %H:%M:%S"
                      },
                      {
                        "file_path": "/var/log/user-data.log",
                        "log_group_name": "/aws/ec2/${AWS::StackName}/user-data",
                        "log_stream_name": "{instance_id}"
                      }
                    ]
                  }
                }
              }
            }
            CWCONF

            /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
              -a fetch-config \
              -m ec2 \
              -s \
              -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json

            systemctl enable amazon-cloudwatch-agent
            echo "CloudWatch agent started successfully"

            echo "=== VPC Proxy bootstrap complete ==="
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-proxy'
              - Key: StackName
                Value: !Ref AWS::StackName
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-proxy-volume'
              - Key: StackName
                Value: !Ref AWS::StackName

  # -------------------------------------------------------------------------
  # NLB Target Group
  # -------------------------------------------------------------------------
  ProxyTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${AWS::StackName}-tg'
      Protocol: TCP
      Port: 9200
      VpcId: !Ref VpcId
      TargetType: instance
      HealthCheckProtocol: TCP
      HealthCheckPort: '9200'
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-tg'
        - Key: StackName
          Value: !Ref AWS::StackName

  # -------------------------------------------------------------------------
  # Network Load Balancer (internal)
  # -------------------------------------------------------------------------
  ProxyNLB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${AWS::StackName}-nlb'
      Type: network
      Scheme: internal
      Subnets:
        - !Ref SubnetId
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nlb'
        - Key: StackName
          Value: !Ref AWS::StackName

  # -------------------------------------------------------------------------
  # NLB Listener
  # -------------------------------------------------------------------------
  ProxyNLBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ProxyNLB
      Protocol: TCP
      Port: 9200
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ProxyTargetGroup

  # -------------------------------------------------------------------------
  # Auto Scaling Group (single instance — size 1/1/1)
  # -------------------------------------------------------------------------
  ProxyAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: ProxyNLBListener
    Properties:
      AutoScalingGroupName: !Sub '${AWS::StackName}-asg'
      MinSize: '1'
      DesiredCapacity: '1'
      MaxSize: '1'
      VPCZoneIdentifier:
        - !Ref SubnetId
      LaunchTemplate:
        LaunchTemplateId: !Ref ProxyLaunchTemplate
        Version: !GetAtt ProxyLaunchTemplate.LatestVersionNumber
      TargetGroupARNs:
        - !Ref ProxyTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 120
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-proxy'
          PropagateAtLaunch: true
        - Key: StackName
          Value: !Ref AWS::StackName
          PropagateAtLaunch: true
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 0
        MaxBatchSize: 1
        PauseTime: PT2M

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:

  ProxyEndpoint:
    Description: >
      Internal NLB endpoint for the Elastic Cloud proxy. Use this as the
      Elasticsearch URL in your migration tool (e.g. the migration GUI).
    Value: !Sub 'http://${ProxyNLB.DNSName}:9200'
    Export:
      Name: !Sub '${AWS::StackName}-ProxyEndpoint'

  ProxyHost:
    Description: NLB DNS name (without scheme or port).
    Value: !GetAtt ProxyNLB.DNSName
    Export:
      Name: !Sub '${AWS::StackName}-ProxyHost'

  SecurityGroupId:
    Description: >
      Security Group ID of the proxy. Add this as an inbound rule source on
      your OpenSearch Service domain's security group if needed.
    Value: !Ref ProxySecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-SecurityGroupId'
