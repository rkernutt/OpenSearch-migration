[project]
name = "opensearch-migration"
version = "1.1.0"
description = "Toolkit for migrating Amazon OpenSearch Service indices to Elastic Cloud"
requires-python = ">=3.9"

[tool.ruff]
target-version = "py39"
line-length = 100
src = [".", "tests"]
exclude = [".venv", "venv", ".git", "iac"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
]
ignore = [
  "E501",  # line length (handled by formatter where needed)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # assert False acceptable in tests
"Proxy/app.py" = ["E402"]  # imports after repo-root sys.path for bootstrap_env

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
explicit_package_bases = true
namespace_packages = true
files = [
  "bootstrap_env.py",
  "validate_migration.py",
  "preflight.py",
  "poll_reindex_task.py",
  "multi_index_reindex.py",
]

