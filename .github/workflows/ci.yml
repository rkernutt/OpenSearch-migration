# pytest, Ruff, optional Terraform validate, dependency audit, secret scanning (non-blocking where noted).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy

      - name: Pytest
        run: python3 -m pytest -q

      - name: pip-audit (informational)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt

  gui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

  gitleaks:
    runs-on: ubuntu-latest
    # Opt into Node.js 24 now so the gitleaks-action (still distributed as a
    # Node 20 action upstream) doesn't emit the deprecation warning. GitHub
    # Actions defaults runners to Node 24 in June 2026; this env var is a
    # no-op once that switch happens.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "latest"

      - name: Terraform fmt (check)
        # Strict: any drift fails the job. Run `terraform fmt -recursive
        # iac/terraform` locally before pushing if this step trips.
        run: terraform fmt -check -recursive iac/terraform

      - name: terraform validate (proxy-alb)
        working-directory: iac/terraform/proxy-alb
        run: |
          terraform init -backend=false
          terraform validate

      - name: terraform validate (proxy-ecs)
        working-directory: iac/terraform/proxy-ecs
        run: |
          terraform init -backend=false
          terraform validate

      - name: terraform validate (rfs-fargate)
        working-directory: iac/terraform/rfs-fargate
        run: |
          terraform init -backend=false
          terraform validate

      - name: terraform validate (rfs-orchestration)
        working-directory: iac/terraform/rfs-orchestration
        run: |
          terraform init -backend=false
          terraform validate
