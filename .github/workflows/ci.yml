# pytest, Ruff, optional Terraform validate, dependency audit, secret scanning (non-blocking where noted).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy

      - name: Pytest
        run: python3 -m pytest -q

      - name: pip-audit (informational)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt

  gui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "latest"

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive iac/terraform || true

      - name: terraform validate (proxy-alb)
        working-directory: iac/terraform/proxy-alb
        run: |
          terraform init -backend=false
          terraform validate

      - name: terraform validate (proxy-ecs)
        working-directory: iac/terraform/proxy-ecs
        run: |
          terraform init -backend=false
          terraform validate

      - name: terraform validate (rfs-fargate)
        working-directory: iac/terraform/rfs-fargate
        run: |
          terraform init -backend=false
          terraform validate

      - name: terraform validate (rfs-orchestration)
        working-directory: iac/terraform/rfs-orchestration
        run: |
          terraform init -backend=false
          terraform validate
